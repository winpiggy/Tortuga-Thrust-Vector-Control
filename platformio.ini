 PlatformIO Project Configuration — TVC Rocket Flight Computer
 Teensy 4.1 | MPU6050 | BMP280 | microSD (onboard SDIO) | 2x gimbal servos

[platformio]
default_envs = flight

; ---------- Shared settings ----------
[env]
platform = teensy
board = teensy41
framework = arduino

board_build.f_cpu = 600000000L
upload_protocol = teensy-cli
monitor_speed = 115200

; SD, SdFat, Servo/PWMServo and Wire ship with the Teensy framework,
; so only the sensor libraries are listed here.
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2
    adafruit/Adafruit BME280 Library @ ^2.6
    adafruit/Adafruit Unified Sensor @ ^1.1
    adafruit/Adafruit BusIO @ ^1.14

build_unflags = -std=gnu++14
build_flags =
    -std=gnu++17
    -Wall
    -I include

; ---------- Flight build ----------
[env:flight]
build_flags =
    ${env.build_flags}
    -D FLIGHT_MODE
    -O2

; ---------- Bench / ground-test build ----------
; Same code, but lets you gate debug output, servo sweep tests,
; and relaxed launch detection behind #ifdef BENCH_MODE.
[env:bench]
build_flags =
    ${env.build_flags}
    -D BENCH_MODE
    -D DEBUG_SERIAL
    -O2